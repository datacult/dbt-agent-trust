- id: 37
  question: How did Black Friday 2017 (November) compare to the surrounding months October and December in GMV and order count and CSAT?
  category: Multi-metric
  difficulty: Hard
  business_rule_tested: Seasonality awareness; multiple metrics; Black Friday context
  expected_sql: |-
    with monthly_metrics as (
    
        select
            date_trunc('month', oi.purchased_at_sao_paulo) as month,
            sum(oi.gmv_amount) as gmv,
            count(distinct oi.order_id) as order_count,
            avg(case when r.is_positive_review then 1.0 else 0.0 end) as csat
        from fct_order_items oi
        left join fct_order_reviews r
            on oi.order_id = r.order_id
        where oi.is_completed
          and oi.purchased_at_sao_paulo >= '2017-10-01'
