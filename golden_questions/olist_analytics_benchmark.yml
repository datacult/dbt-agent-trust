- id: 33
  question: What was the average carrier handoff time by seller state for the top 10 states by volume?
  category: Multi-metric
  difficulty: Hard
  business_rule_tested: Handoff = delivered_carrier_date minus approved_at; ranking plus aggregation
  expected_sql: |-
    with seller_volume as (
    
        select
            seller_state,
            count(*) as item_count
        from fct_order_items
        where is_completed
        group by seller_state
        order by item_count desc
        limit 10
    
    )
    
    select
        oi.seller_state,
        avg(o.carrier_handoff_days) as average_handoff_days
    from fct_order_items oi
    join fct_orders o
        on oi.order_id = o.order_id
    join seller_volume sv
        on oi.seller_state = sv.seller_state
    where o.is_delivered
    group by oi.seller_state
    order by average_handoff_days;
