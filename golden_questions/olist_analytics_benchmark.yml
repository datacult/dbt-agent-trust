- id: 16
  question: What was the cancellation rate for the top 10 categories by order volume?
  category: Ratio
  difficulty: Medium
  business_rule_tested: Cancel rate = canceled / (completed + canceled); exclude created and unavailable from denominator
  expected_sql: |-
    with top_categories as (
    
        select
            product_category_name,
            count(distinct order_id) as order_count
        from fct_order_items
        where order_status in ('approved', 'processing', 'invoiced', 'shipped', 'delivered', 'canceled')
        group by 1
        order by order_count desc
        limit 10
    
    )
    
    select
        oi.product_category_name,
        count(distinct case when order_status = 'canceled' then order_id end) * 100.0
            /
        count(distinct order_id) as cancellation_rate
    from fct_order_items oi
    join top_categories tc
      on oi.product_category_name = tc.product_category_name
    where order_status in ('approved', 'processing', 'invoiced', 'shipped', 'delivered', 'canceled')
    group by 1
    order by cancellation_rate desc;
  expected_answer: 'product_category_name │  cancellation_rate  │
│        varchar        │       double        │
├───────────────────────┼─────────────────────┤
│ toys                  │   0.797735460627895 │
│ housewares            │   0.628823929299796 │
│ auto                  │  0.6160164271047228 │
│ sports_leisure        │  0.6088082901554405 │
│ computers_accessories │  0.5232471221408282 │
│ health_beauty         │  0.4074241738343142 │
│ telephony             │  0.3810431055013098 │
│ furniture_decor       │   0.372150721042022 │
