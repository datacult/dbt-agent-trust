- id: 1
  question: What was total GMV for Q1 2018?
  category: Aggregation
  difficulty: Easy
  business_rule_tested: 'GMV definition: SUM(price) on completed orders only, excludes freight'
  expected_sql: |-
    select
        sum(gmv_amount) as total_gmv
    from fct_order_items
    where is_completed
      and purchased_at_sao_paulo >= '2018-01-01'
      and purchased_at_sao_paulo < '2018-04-01';
  expected_answer: 2766044.1899997615 (2.77 million)

