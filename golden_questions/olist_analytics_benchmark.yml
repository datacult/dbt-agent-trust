            sum(gmv_amount) as gmv
        from fct_order_items
        where is_completed
          and purchased_at_sao_paulo >= '2017-01-01'
          and purchased_at_sao_paulo < '2018-01-01'
        group by 1, 2
    
    )
    
    select
        customer_region,
        quarter,
        gmv,
        (
            gmv - lag(gmv) over (
