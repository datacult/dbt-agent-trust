- id: 30
  question: What percentage of total GMV comes from the top 10% of sellers?
  category: Ratio
  difficulty: Hard
  business_rule_tested: Seller concentration / Pareto analysis; percentile bucketing
  expected_sql: |-
    with seller_gmv as (
    
        select
            seller_id,
            sum(gmv_amount) as gmv
        from fct_order_items
        where is_completed
        group by seller_id
    
    ),
    
    ranked_sellers as (
    
        select
            *,
            ntile(10) over (order by gmv desc) as seller_decile
        from seller_gmv
    
    )
    
    select
        sum(case when seller_decile = 1 then gmv else 0 end)
            * 100.0
            / sum(gmv) as top_10_percent_gmv_share
    from ranked_sellers;
  expected_answer: 'top_10_percent_gmv_share │
│          double          │
├──────────────────────────┤
│        67.50012012760179'

